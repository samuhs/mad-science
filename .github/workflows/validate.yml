name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Plugin packaging
        run: python3 scripts/validate_plugin.py
      - name: Skill tests
        run: |
          python3 -m pytest skills/notify-gchat-human-wait/scripts/tests -q
          python3 skills/experiment-graph/scripts/test_model.py
